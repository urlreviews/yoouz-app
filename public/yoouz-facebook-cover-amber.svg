    <!-- Warm Golden Amber Sunset Gradient - High energy & contrast like Yelp Red, but in Yoouz Amber -->
    <linearGradient id="amberBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="25%" stop-color="#d97706"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Ambient Center Vignette -->
    <radialGradient id="centerVignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.25"/>
    </radialGradient>

