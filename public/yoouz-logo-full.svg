<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Star Icon Badge with Rounded Squircle -->
  <g filter="url(#shadow)">
    <rect x="20" y="30" width="180" height="180" rx="42" fill="url(#badgeBg)"/>
    <rect x="21" y="31" width="178" height="178" rx="41" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <g transform="translate(56, 66) scale(4.5)">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="url(#starGrad)"/>
    </g>
  </g>

  <!-- Yoouz Typographic Wordmark for Dark Backgrounds -->
  <text x="235" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-1px" fill="#ffffff">
    Yoouz
  </text>
  <text x="240" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4px" fill="#a1a1aa">
    AUTHENTIC VIDEO REVIEWS
  </text>
</svg>
