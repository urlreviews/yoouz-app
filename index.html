    <script>
      // Instantly dismiss splash once React executes or DOM is ready
      function hideSplash() {
        const loader = document.getElementById('app-splash-loader');
        if (loader && loader.dataset.dismissed !== 'true') {
          loader.dataset.dismissed = 'true';
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';
          loader.style.transition = 'opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
          setTimeout(() => {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 300);
        }
      }
      window.__dismissAppSplash = hideSplash;
      if (document.readyState === 'complete') {
        setTimeout(hideSplash, 50);
      } else {
        window.addEventListener('DOMContentLoaded', hideSplash);
        window.addEventListener('load', hideSplash);
      }
      setTimeout(hideSplash, 1500); // Fail-safe max timeout
    </script>
