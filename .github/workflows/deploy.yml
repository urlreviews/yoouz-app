name: Deploy Yoouz App (Bunny Magic Containers)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (for Bunny Magic Containers)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GitHub Container Registry (Bunny Magic Containers)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Trigger Bunny Magic Containers Auto-Deploy (API / Webhook)
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_APP_ID: ${{ secrets.BUNNY_APP_ID || 'YEbe6RV5vr3sq3I' }}
          BUNNY_WEBHOOK: ${{ secrets.BUNNY_DEPLOY_WEBHOOK }}
        run: |
          echo "🚀 Triggering Bunny Magic Containers Auto-Deploy..."
          
          # 1. Trigger via Bunny Magic Containers REST API (/mc/apps)
          if [ -n "$BUNNY_API_KEY" ]; then
            echo "📡 Dispatching Bunny Magic Containers API commands for app: $BUNNY_APP_ID..."
            curl -s -X POST "https://api.bunny.net/mc/apps/$BUNNY_APP_ID/deploy" \
              -H "AccessKey: $BUNNY_API_KEY" \
              -H "Content-Type: application/json" || true
            curl -s -X POST "https://api.bunny.net/mc/apps/$BUNNY_APP_ID/restart" \
              -H "AccessKey: $BUNNY_API_KEY" \
              -H "Content-Type: application/json" || true
            echo "✅ Bunny Magic Containers API auto-deploy command sent!"
          fi

          # 2. Trigger via Webhook if configured
          if [ -n "$BUNNY_WEBHOOK" ]; then
            echo "📡 Pinging Bunny Deploy Webhook..."
            curl -s -f -X POST "$BUNNY_WEBHOOK" && echo "✅ Bunny Webhook triggered successfully!" || echo "⚠️ Webhook pinged."
          fi




