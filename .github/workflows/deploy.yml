name: Deploy to Google Cloud and Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Deploy to Cloud Run (Backend)
        run: |
          gcloud auth configure-docker --quiet
          docker build -t gcr.io/gen-lang-client-0669185519/yoouz .
          docker push gcr.io/gen-lang-client-0669185519/yoouz
          gcloud run deploy yoouz \
            --image gcr.io/gen-lang-client-0669185519/yoouz \
            --platform managed \
            --region europe-west1 \
            --set-env-vars NODE_ENV=production \
            --allow-unauthenticated
          gcloud run deploy yoouz-app \
            --image gcr.io/gen-lang-client-0669185519/yoouz \
            --platform managed \
            --region europe-west1 \
            --set-env-vars NODE_ENV=production \
            --allow-unauthenticated

      - name: Deploy to Firebase Hosting (Frontend)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_CREDENTIALS }}
          channelId: live
          projectId: gen-lang-client-0669185519
