name: Deploy Yoouz App (Cloud Run + Bunny & Resend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Deploy to Cloud Run (Backend)
        run: |
          gcloud auth configure-docker --quiet
          docker build -t gcr.io/gen-lang-client-0669185519/yoouz .
          docker push gcr.io/gen-lang-client-0669185519/yoouz
          gcloud run deploy yoouz \
            --image gcr.io/gen-lang-client-0669185519/yoouz \
            --platform managed \
            --region europe-west1 \
            --set-env-vars NODE_ENV=production,RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}",BUNNY_DATABASE_URL="${{ secrets.BUNNY_DATABASE_URL }}",BUNNY_DATABASE_AUTH_TOKEN="${{ secrets.BUNNY_DATABASE_AUTH_TOKEN }}",BUNNY_STORAGE_API_KEY="${{ secrets.BUNNY_STORAGE_API_KEY }}",BUNNY_STORAGE_ZONE_NAME="${{ secrets.BUNNY_STORAGE_ZONE_NAME }}",BUNNY_PULL_ZONE_URL="${{ secrets.BUNNY_PULL_ZONE_URL }}",GOOGLE_MAPS_PLATFORM_KEY="${{ secrets.GOOGLE_MAPS_PLATFORM_KEY }}" \
            --allow-unauthenticated
          gcloud run deploy yoouz-app \
            --image gcr.io/gen-lang-client-0669185519/yoouz \
            --platform managed \
            --region europe-west1 \
            --set-env-vars NODE_ENV=production,RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}",BUNNY_DATABASE_URL="${{ secrets.BUNNY_DATABASE_URL }}",BUNNY_DATABASE_AUTH_TOKEN="${{ secrets.BUNNY_DATABASE_AUTH_TOKEN }}",BUNNY_STORAGE_API_KEY="${{ secrets.BUNNY_STORAGE_API_KEY }}",BUNNY_STORAGE_ZONE_NAME="${{ secrets.BUNNY_STORAGE_ZONE_NAME }}",BUNNY_PULL_ZONE_URL="${{ secrets.BUNNY_PULL_ZONE_URL }}",GOOGLE_MAPS_PLATFORM_KEY="${{ secrets.GOOGLE_MAPS_PLATFORM_KEY }}" \
            --allow-unauthenticated

      - name: Deploy to Firebase Hosting
        run: |
          npx --yes firebase-tools deploy --only hosting --project gen-lang-client-0669185519 --non-interactive
